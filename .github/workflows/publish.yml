# GitHub Packages 자동 배포 — v* 태그 push 시 CI가 npm publish.
#  · 이전엔 update.sh로 로컬 수동 publish(누락 위험) → 태그 기반 자동화로 "커밋했는데 배포 누락" 재발 방지.
#  · 인증: 워크플로 GITHUB_TOKEN(packages:write) — 소유 org(jjaim519)의 GitHub Packages에 publish. 별도 토큰 불필요.
#  · registry-url+scope가 러너에 .npmrc(스코프 레지스트리 + _authToken)를 깐다. package.json publishConfig와 정합.
name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@jjaim519'
      - run: npm install --no-audit --no-fund
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
